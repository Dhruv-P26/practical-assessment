stages:
  - build
  - deploy

build-and-push:
  stage: build
  image: docker:25.0
  services:
    - docker:25.0-dind
  script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - docker build -t dhruv2608prajapati/cloudops:v2 .
    - docker push dhruv2608prajapati/cloudops:v2

deploy-to-ec2:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - ssh ubuntu@13.203.161.162 "
        docker login -u '$DOCKERHUB_USER' -p '$DOCKERHUB_PASSWORD' &&
        docker stop netflix-app || true &&
        docker rm netflix-app || true &&
        docker pull dhruv2608prajapati/cloudops:v1 &&
        docker run -d --name cloudops -p 80:80 dhruv2608prajapati/cloudops:v2"