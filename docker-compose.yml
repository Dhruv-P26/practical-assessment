version: '3.8'

services:
  # Data Tier
  db:
    image: postgres:15-alpine
    container_name: myproject-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # Logic Tier (Python Backend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myproject-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=mydatabase
    depends_on:
      - db

  # Presentation Tier (Nginx React Frontend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myproject-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
